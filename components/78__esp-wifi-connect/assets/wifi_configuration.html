<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="referrer no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#04101b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Wi-Fi Setup">
    <title>Wi-Fi Setup</title>
    <style>
        :root {
            --bg-1: #04101b;
            --bg-2: #081626;
            --bg-3: #10243a;
            --panel: rgba(8, 18, 31, 0.9);
            --panel-soft: rgba(11, 24, 41, 0.78);
            --panel-strong: rgba(5, 12, 22, 0.94);
            --line: rgba(118, 171, 214, 0.16);
            --line-strong: rgba(118, 210, 255, 0.38);
            --text: #eef7ff;
            --muted: #8ea7c1;
            --muted-strong: #bed3e8;
            --accent: #62dcff;
            --accent-strong: #2a8dff;
            --accent-soft: rgba(98, 220, 255, 0.14);
            --accent-glow: rgba(42, 141, 255, 0.28);
            --danger: #ff7d91;
            --shadow: 0 24px 70px rgba(0, 0, 0, 0.36);
            --radius-xl: 30px;
            --radius-lg: 22px;
            --radius-md: 16px;
        }

        * {
            box-sizing: border-box;
        }

        html {
            color-scheme: dark;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: block;
            padding:
                calc(8px + env(safe-area-inset-top))
                calc(8px + env(safe-area-inset-right))
                calc(8px + env(safe-area-inset-bottom))
                calc(8px + env(safe-area-inset-left));
            color: var(--text);
            font-family: "Avenir Next", "SF Pro Display", "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at 14% 16%, rgba(42, 141, 255, 0.24), transparent 28%),
                radial-gradient(circle at 84% 14%, rgba(98, 220, 255, 0.16), transparent 24%),
                radial-gradient(circle at 50% 100%, rgba(31, 110, 196, 0.18), transparent 42%),
                linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 46%, var(--bg-3) 100%);
            overflow-x: hidden;
            overflow-y: auto;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: 0.12;
            background-image:
                linear-gradient(rgba(121, 169, 216, 0.2) 1px, transparent 1px),
                linear-gradient(90deg, rgba(121, 169, 216, 0.2) 1px, transparent 1px);
            background-size: 28px 28px;
            mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.8), transparent 92%);
        }

        .shell {
            width: min(1100px, 100%);
            margin: 0 auto;
        }

        .card {
            position: relative;
            display: grid;
            grid-template-rows: auto auto;
            gap: 14px;
            padding: 16px;
            border: 1px solid var(--line);
            border-radius: var(--radius-xl);
            background:
                linear-gradient(180deg, rgba(10, 21, 36, 0.94), rgba(7, 15, 28, 0.92)),
                radial-gradient(circle at top right, rgba(98, 220, 255, 0.08), transparent 30%);
            box-shadow: var(--shadow);
            overflow: visible;
            animation: rise 560ms cubic-bezier(0.2, 1, 0.22, 1) both;
        }

        .card::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(135deg, rgba(255, 255, 255, 0.05), transparent 24%),
                radial-gradient(circle at bottom left, rgba(98, 220, 255, 0.08), transparent 28%);
        }

        .topbar {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            padding: 4px 4px 12px;
            border-bottom: 1px solid rgba(118, 171, 214, 0.12);
            z-index: 1;
        }

        .brand {
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-visual {
            width: 68px;
            height: 68px;
            flex: 0 0 68px;
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid rgba(118, 210, 255, 0.24);
            background: linear-gradient(180deg, rgba(14, 28, 45, 0.94), rgba(8, 17, 29, 0.92));
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.08),
                0 16px 28px rgba(0, 0, 0, 0.26);
        }

        .brand-visual img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 48%;
            transform: scale(1.06);
        }

        .eyebrow {
            margin: 0 0 5px;
            color: var(--accent);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(22px, 2.6vw, 30px);
            line-height: 1.05;
            letter-spacing: -0.03em;
        }

        .subtle {
            margin: 4px 0 0;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.45;
        }

        .refresh {
            appearance: none;
            border: 1px solid rgba(118, 171, 214, 0.18);
            border-radius: 999px;
            background: rgba(15, 30, 49, 0.72);
            color: var(--text);
            padding: 10px 14px;
            font: inherit;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
            cursor: pointer;
            transition: transform 150ms ease, border-color 150ms ease, background 150ms ease;
        }

        .refresh:hover:not(:disabled) {
            transform: translateY(-1px);
            border-color: rgba(98, 220, 255, 0.34);
            background: rgba(18, 38, 61, 0.82);
        }

        .refresh:disabled {
            opacity: 0.54;
            cursor: wait;
        }

        .layout {
            position: relative;
            display: grid;
            grid-template-columns: 1fr;
            grid-template-rows: auto auto;
            gap: 14px;
            z-index: 1;
        }

        .pane {
            position: relative;
            display: flex;
            flex-direction: column;
            padding: 14px;
            border: 1px solid rgba(118, 171, 214, 0.12);
            border-radius: var(--radius-lg);
            background:
                linear-gradient(180deg, rgba(11, 24, 40, 0.86), rgba(6, 14, 25, 0.94)),
                radial-gradient(circle at top left, rgba(98, 220, 255, 0.06), transparent 34%);
            overflow: hidden;
        }

        .pane::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.04), transparent 32%);
        }

        .pane-head {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
            z-index: 1;
        }

        .section-title {
            margin: 0;
            font-size: 15px;
            line-height: 1.15;
            letter-spacing: -0.02em;
        }

        .section-copy {
            margin: 4px 0 0;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.4;
        }

        .status-line {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin: 0;
            padding: 8px 10px;
            border: 1px solid rgba(118, 171, 214, 0.14);
            border-radius: 999px;
            background: rgba(16, 30, 49, 0.68);
            color: var(--muted-strong);
            font-size: 12px;
            line-height: 1.2;
        }

        .pulse {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 0 0 rgba(98, 220, 255, 0.32);
            animation: pulse 1.4s ease-in-out infinite;
        }

        .list-pane {
            background:
                linear-gradient(180deg, rgba(236, 247, 255, 0.06), rgba(198, 221, 243, 0.035)),
                linear-gradient(180deg, rgba(12, 24, 40, 0.8), rgba(7, 16, 29, 0.9));
        }

        .list-pane::before {
            background:
                linear-gradient(135deg, rgba(255, 255, 255, 0.08), transparent 32%),
                radial-gradient(circle at top left, rgba(98, 220, 255, 0.08), transparent 36%);
        }

        .network-list {
            position: relative;
            min-height: 260px;
            max-height: 360px;
            overflow-y: auto;
            padding: 4px 6px 4px 0;
            display: flex;
            flex-direction: column;
            gap: 7px;
            z-index: 1;
            scroll-behavior: smooth;
        }

        .network-list::-webkit-scrollbar {
            width: 10px;
        }

        .network-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.045);
            border-radius: 999px;
        }

        .network-list::-webkit-scrollbar-thumb {
            background: rgba(172, 205, 232, 0.38);
            border-radius: 999px;
            border: 2px solid transparent;
            background-clip: padding-box;
        }

        .network-item {
            width: 100%;
            appearance: none;
            border: 1px solid rgba(187, 214, 236, 0.12);
            border-radius: var(--radius-md);
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.045), rgba(255, 255, 255, 0.018)),
                linear-gradient(180deg, rgba(15, 29, 47, 0.82), rgba(9, 18, 32, 0.9));
            padding: 9px 12px;
            text-align: left;
            color: var(--text);
            cursor: pointer;
            transition:
                transform 160ms ease,
                border-color 160ms ease,
                box-shadow 160ms ease,
                background 160ms ease;
        }

        .network-item:hover {
            transform: translateY(-1px);
            border-color: rgba(98, 220, 255, 0.22);
            box-shadow: 0 10px 18px rgba(0, 0, 0, 0.18);
        }

        .network-item.selected {
            border-color: rgba(98, 220, 255, 0.52);
            background:
                linear-gradient(180deg, rgba(29, 65, 103, 0.94), rgba(12, 28, 46, 0.96)),
                radial-gradient(circle at top left, rgba(98, 220, 255, 0.14), transparent 42%);
            box-shadow:
                inset 0 0 0 1px rgba(98, 220, 255, 0.08),
                0 12px 22px rgba(18, 63, 118, 0.22);
        }

        .network-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .network-name {
            min-width: 0;
            font-size: 13px;
            font-weight: 700;
            line-height: 1.25;
            word-break: break-word;
        }

        .signal {
            flex: 0 0 auto;
            padding: 3px 7px;
            border-radius: 999px;
            background: var(--accent-soft);
            color: var(--accent);
            font-size: 10px;
            font-weight: 700;
            white-space: nowrap;
        }

        .network-meta {
            margin-top: 5px;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            color: var(--muted);
            font-size: 11px;
            line-height: 1.25;
        }

        .network-meta span {
            display: inline-flex;
            align-items: center;
            padding: 2px 7px;
            border: 1px solid rgba(190, 214, 233, 0.08);
            border-radius: 999px;
            background: rgba(236, 247, 255, 0.045);
        }

        .empty-state {
            padding: 16px;
            border: 1px dashed rgba(118, 171, 214, 0.18);
            border-radius: var(--radius-md);
            background: rgba(12, 25, 42, 0.48);
            color: var(--muted);
            font-size: 13px;
            line-height: 1.55;
        }

        .form-pane {
            justify-content: flex-start;
            gap: 12px;
        }

        .selection-card {
            position: relative;
            padding: 12px 14px;
            border: 1px solid rgba(118, 171, 214, 0.14);
            border-radius: 18px;
            background:
                linear-gradient(180deg, rgba(13, 28, 47, 0.88), rgba(8, 18, 31, 0.8)),
                radial-gradient(circle at top left, rgba(98, 220, 255, 0.08), transparent 42%);
            z-index: 1;
        }

        .saved-panel {
            position: relative;
            padding: 11px 12px;
            border: 1px solid rgba(118, 171, 214, 0.12);
            border-radius: 18px;
            background:
                linear-gradient(180deg, rgba(12, 25, 42, 0.74), rgba(8, 18, 31, 0.86)),
                radial-gradient(circle at top left, rgba(98, 220, 255, 0.05), transparent 46%);
            z-index: 1;
        }

        .saved-panel[hidden] {
            display: none;
        }

        .saved-list {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 7px;
            max-height: 124px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .saved-list::-webkit-scrollbar {
            width: 8px;
        }

        .saved-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.045);
            border-radius: 999px;
        }

        .saved-list::-webkit-scrollbar-thumb {
            background: rgba(172, 205, 232, 0.34);
            border-radius: 999px;
        }

        .saved-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 8px 10px;
            border: 1px solid rgba(187, 214, 236, 0.08);
            border-radius: 14px;
            background: rgba(236, 247, 255, 0.04);
        }

        .saved-item-main {
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .saved-item-name {
            min-width: 0;
            color: var(--text);
            font-size: 12px;
            font-weight: 700;
            line-height: 1.3;
            word-break: break-word;
        }

        .saved-item-badges {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .saved-badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 7px;
            border-radius: 999px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.02em;
            white-space: nowrap;
        }

        .saved-badge.primary {
            background: rgba(98, 220, 255, 0.12);
            color: var(--accent);
        }

        .saved-badge.muted {
            background: rgba(255, 255, 255, 0.06);
            color: var(--muted);
        }

        .saved-delete {
            flex: 0 0 auto;
            appearance: none;
            border: 1px solid rgba(255, 125, 145, 0.2);
            border-radius: 999px;
            background: rgba(255, 125, 145, 0.08);
            color: var(--danger);
            padding: 6px 10px;
            font: inherit;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: border-color 140ms ease, background 140ms ease, opacity 140ms ease;
        }

        .saved-delete:hover:not(:disabled) {
            border-color: rgba(255, 125, 145, 0.34);
            background: rgba(255, 125, 145, 0.14);
        }

        .saved-delete:disabled {
            opacity: 0.46;
            cursor: wait;
        }

        .selection-label {
            display: block;
            margin-bottom: 8px;
            color: var(--muted);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        .selection-card strong {
            display: block;
            font-size: 16px;
            line-height: 1.32;
            word-break: break-word;
        }

        .selection-meta {
            display: block;
            margin-top: 7px;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.45;
        }

        form {
            position: relative;
            z-index: 1;
        }

        .field {
            margin-bottom: 12px;
        }

        .field label {
            display: block;
            margin-bottom: 7px;
            color: var(--muted-strong);
            font-size: 12px;
            font-weight: 700;
        }

        .field input {
            width: 100%;
            appearance: none;
            border: 1px solid rgba(118, 171, 214, 0.16);
            border-radius: 14px;
            background: rgba(6, 14, 26, 0.9);
            color: var(--text);
            padding: 12px 14px;
            font: inherit;
            font-size: 14px;
            outline: none;
            transition: border-color 140ms ease, box-shadow 140ms ease, background 140ms ease;
        }

        .field input:focus {
            border-color: rgba(98, 220, 255, 0.42);
            box-shadow: 0 0 0 4px rgba(98, 220, 255, 0.12);
            background: rgba(9, 19, 34, 0.94);
        }

        .field input:disabled {
            cursor: not-allowed;
            opacity: 0.76;
        }

        .password-wrap {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            top: 50%;
            right: 8px;
            transform: translateY(-50%);
            appearance: none;
            border: 1px solid rgba(118, 171, 214, 0.14);
            border-radius: 999px;
            background: rgba(17, 33, 54, 0.78);
            color: var(--text);
            padding: 6px 10px;
            font: inherit;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }

        .toggle-password:disabled {
            opacity: 0.42;
            cursor: not-allowed;
        }

        .submit {
            width: 100%;
            appearance: none;
            border: 0;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-strong) 100%);
            color: #04111d;
            padding: 12px 14px;
            font: inherit;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 0.01em;
            cursor: pointer;
            box-shadow: 0 16px 30px var(--accent-glow);
            transition: transform 160ms ease, box-shadow 160ms ease, opacity 160ms ease;
        }

        .submit:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 20px 36px rgba(42, 141, 255, 0.34);
        }

        .submit:disabled {
            opacity: 0.42;
            cursor: not-allowed;
            box-shadow: none;
        }

        .error {
            min-height: 18px;
            margin: 8px 0 0;
            color: var(--danger);
            font-size: 12px;
            line-height: 1.45;
        }

        .microcopy {
            margin: 6px 0 0;
            color: var(--muted);
            font-size: 11px;
            line-height: 1.45;
        }

        .list-helper {
            margin: 0 0 10px;
            padding: 10px 12px;
            border: 1px solid rgba(196, 219, 240, 0.1);
            border-radius: 14px;
            background: rgba(236, 247, 255, 0.04);
            color: var(--muted);
            font-size: 11px;
            line-height: 1.5;
        }

        .overlay {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(3, 9, 17, 0.58);
            backdrop-filter: blur(10px);
        }

        .overlay.show {
            display: flex;
        }

        .overlay-card {
            width: min(320px, 100%);
            padding: 24px 20px;
            border: 1px solid rgba(118, 171, 214, 0.16);
            border-radius: 24px;
            background: rgba(7, 15, 28, 0.94);
            box-shadow: var(--shadow);
            text-align: center;
        }

        .spinner {
            width: 54px;
            height: 54px;
            margin: 0 auto 16px;
            border: 4px solid rgba(255, 255, 255, 0.12);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.92s linear infinite;
        }

        .overlay-title {
            margin: 0 0 8px;
            font-size: 18px;
            line-height: 1.2;
        }

        .overlay-text {
            margin: 0;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.55;
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(98, 220, 255, 0.32);
                transform: scale(0.9);
            }
            50% {
                box-shadow: 0 0 0 7px rgba(98, 220, 255, 0);
                transform: scale(1.08);
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 920px) {
            .layout {
                grid-template-columns: 1fr;
            }

            .network-list {
                max-height: 340px;
            }
        }

        @media (max-width: 640px) {
            body {
                padding: 6px;
            }

            .card {
                gap: 10px;
                padding: 12px;
                border-radius: 24px;
            }

            .topbar {
                gap: 10px;
                padding: 2px 2px 10px;
            }

            .brand {
                gap: 10px;
            }

            .brand-visual {
                width: 52px;
                height: 52px;
                flex-basis: 52px;
                border-radius: 14px;
            }

            h1 {
                font-size: 20px;
            }

            .subtle {
                display: none;
            }

            .pane {
                padding: 12px;
            }

            .pane-head {
                align-items: flex-start;
                flex-direction: column;
            }

            .refresh {
                padding: 9px 12px;
            }

            .network-list {
                min-height: 220px;
                max-height: 46vh;
                gap: 6px;
            }

            .network-item {
                padding: 8px 10px;
            }

            .selection-card strong {
                font-size: 15px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>
<body>
    <main class="shell">
        <section class="card">
            <div class="topbar">
                <div class="brand">
                    <div class="brand-visual">
                        <img src="bo-wifi.jpg" alt="Wi-Fi setup visual">
                    </div>
                    <div>
                        <p class="eyebrow">Provisioning Portal</p>
                        <h1>Connect lichuang_esp32s3</h1>
                    </div>
                </div>

                <button class="refresh" id="refreshButton" type="button">Refresh</button>
            </div>

            <div class="layout">
                <section class="pane form-pane" id="formPane">
                    <div>
                        <h2 class="section-title">Network</h2>
                    </div>

                    <div class="saved-panel" id="savedNetworksPanel" hidden>
                        <span class="selection-label">Saved Wi-Fi</span>
                        <div class="saved-list" id="savedNetworksList"></div>
                    </div>

                    <div class="selection-card">
                        <span class="selection-label">Selected Wi-Fi</span>
                        <strong id="selectedNetworkValue">No network selected</strong>
                        <span class="selection-meta" id="selectedSecurityValue" hidden></span>
                    </div>

                    <form id="wifiForm">
                        <input id="ssid" name="ssid" type="hidden">

                        <div class="field">
                            <label for="password">Password</label>
                            <div class="password-wrap">
                                <input id="password" name="password" type="password" placeholder="Select Wi-Fi first" disabled>
                                <button class="toggle-password" id="togglePassword" type="button" disabled>Show</button>
                            </div>
                        </div>

                        <button class="submit" id="submitButton" type="submit" disabled>Save Wi-Fi</button>
                        <p class="error" id="error"></p>
                    </form>
                </section>

                <section class="pane list-pane">
                    <div class="pane-head">
                        <div>
                            <h2 class="section-title">Available Wi-Fi</h2>
                        </div>
                        <p class="status-line" id="scanStatus">
                            <span class="pulse"></span>
                            <span>Scanning...</span>
                        </p>
                    </div>

                    <div class="network-list" id="networkList"></div>
                </section>
            </div>
        </section>
    </main>

    <div class="overlay" id="loadingOverlay">
        <div class="overlay-card">
            <div class="spinner"></div>
            <h2 class="overlay-title" id="loadingOverlayTitle">Checking Wi-Fi...</h2>
            <p class="overlay-text" id="loadingOverlayText">The device is testing this network and saving the password. Keep this page open for a few seconds.</p>
        </div>
    </div>

    <script>
        const refreshButton = document.getElementById('refreshButton');
        const networkList = document.getElementById('networkList');
        const scanStatus = document.getElementById('scanStatus');
        const ssidInput = document.getElementById('ssid');
        const passwordInput = document.getElementById('password');
        const togglePasswordButton = document.getElementById('togglePassword');
        const submitButton = document.getElementById('submitButton');
        const errorLabel = document.getElementById('error');
        const wifiForm = document.getElementById('wifiForm');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const savedNetworksPanel = document.getElementById('savedNetworksPanel');
        const savedNetworksList = document.getElementById('savedNetworksList');
        const loadingOverlayTitle = document.getElementById('loadingOverlayTitle');
        const loadingOverlayText = document.getElementById('loadingOverlayText');
        const selectedNetworkValue = document.getElementById('selectedNetworkValue');
        const selectedSecurityValue = document.getElementById('selectedSecurityValue');
        const formPane = document.getElementById('formPane');

        const state = {
            selectedSsid: '',
            selectedAuthmode: 0,
            refreshTimer: null,
            isRefreshing: false,
            fullscreenTried: false,
            savedNetworks: [],
        };

        function hideBrowserChrome() {
            window.setTimeout(() => window.scrollTo(0, 1), 0);
            window.setTimeout(() => window.scrollTo(0, 1), 180);
        }

        function requestFullscreen() {
            if (state.fullscreenTried) {
                return;
            }

            state.fullscreenTried = true;
            const root = document.documentElement;
            const request =
                root.requestFullscreen ||
                root.webkitRequestFullscreen ||
                root.msRequestFullscreen;

            if (!request) {
                return;
            }

            Promise.resolve(request.call(root)).catch(() => {
                state.fullscreenTried = false;
            });
        }

        function enterImmersiveMode() {
            hideBrowserChrome();
            requestFullscreen();
        }

        function escapeHtml(text) {
            return text.replace(/[&<>"']/g, function(char) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#39;',
                }[char];
            });
        }

        function authLabel(authmode) {
            return authmode === 0 ? 'Open network' : 'Secured network';
        }

        function signalLabel(rssi) {
            if (rssi >= -55) {
                return 'Excellent';
            }
            if (rssi >= -67) {
                return 'Good';
            }
            if (rssi >= -75) {
                return 'Fair';
            }
            return 'Weak';
        }

        function setStatus(text) {
            scanStatus.innerHTML = '<span class="pulse"></span><span>' + text + '</span>';
        }

        function setLoadingState(title, text) {
            loadingOverlayTitle.textContent = title;
            loadingOverlayText.textContent = text;
        }

        function updateSubmitState() {
            submitButton.disabled = state.selectedSsid.length === 0;
        }

        function updatePasswordState(authmode) {
            const hasSelection = state.selectedSsid.length > 0;
            if (!hasSelection) {
                passwordInput.disabled = true;
                togglePasswordButton.disabled = true;
                passwordInput.value = '';
                passwordInput.type = 'password';
                passwordInput.placeholder = 'Select Wi-Fi first';
                togglePasswordButton.textContent = 'Show';
                return;
            }

            const isOpenNetwork = authmode === 0;
            passwordInput.disabled = isOpenNetwork;
            togglePasswordButton.disabled = isOpenNetwork;

            if (isOpenNetwork) {
                passwordInput.value = '';
                passwordInput.type = 'password';
                passwordInput.placeholder = 'No password needed';
                togglePasswordButton.textContent = 'Show';
                return;
            }

            passwordInput.placeholder = 'Enter Wi-Fi password';
        }

        function updateSelectionCard(ssid, authmode) {
            if (!ssid) {
                selectedNetworkValue.textContent = 'No network selected';
                selectedSecurityValue.textContent = '';
                selectedSecurityValue.hidden = true;
                return;
            }

            selectedNetworkValue.textContent = ssid;
            selectedSecurityValue.textContent = state.savedNetworks.includes(ssid)
                ? authLabel(authmode) + ' • Saved on device'
                : authLabel(authmode);
            selectedSecurityValue.hidden = false;
        }

        function renderSavedNetworks(savedNetworks) {
            state.savedNetworks = savedNetworks.slice();
            savedNetworksList.innerHTML = '';

            if (!savedNetworks.length) {
                savedNetworksPanel.hidden = true;
                if (state.selectedSsid) {
                    updateSelectionCard(state.selectedSsid, state.selectedAuthmode);
                }
                return;
            }

            savedNetworksPanel.hidden = false;

            savedNetworks.forEach((ssid, index) => {
                const item = document.createElement('div');
                item.className = 'saved-item';

                const main = document.createElement('div');
                main.className = 'saved-item-main';

                const name = document.createElement('div');
                name.className = 'saved-item-name';
                name.textContent = ssid;

                const badges = document.createElement('div');
                badges.className = 'saved-item-badges';

                const savedBadge = document.createElement('span');
                savedBadge.className = 'saved-badge primary';
                savedBadge.textContent = 'Saved';
                badges.appendChild(savedBadge);

                if (index === 0) {
                    const defaultBadge = document.createElement('span');
                    defaultBadge.className = 'saved-badge muted';
                    defaultBadge.textContent = 'Default';
                    badges.appendChild(defaultBadge);
                }

                main.appendChild(name);
                main.appendChild(badges);

                const removeButton = document.createElement('button');
                removeButton.type = 'button';
                removeButton.className = 'saved-delete';
                removeButton.textContent = 'Delete';
                removeButton.addEventListener('click', async () => {
                    removeButton.disabled = true;
                    try {
                        await fetch('/saved/delete?index=' + index, { cache: 'no-store' });
                        await loadSavedNetworks();
                    } catch (err) {
                        errorLabel.textContent = 'Unable to delete saved Wi-Fi right now.';
                    } finally {
                        removeButton.disabled = false;
                    }
                });

                item.appendChild(main);
                item.appendChild(removeButton);
                savedNetworksList.appendChild(item);
            });

            if (state.selectedSsid) {
                updateSelectionCard(state.selectedSsid, state.selectedAuthmode);
            }
        }

        async function loadSavedNetworks() {
            try {
                const response = await fetch('/saved/list', { cache: 'no-store' });
                const data = await response.json();
                renderSavedNetworks(Array.isArray(data) ? data : []);
            } catch (err) {
                renderSavedNetworks([]);
            }
        }

        function selectNetwork(ssid, authmode, options) {
            const settings = Object.assign({ scrollToForm: true }, options || {});
            state.selectedSsid = ssid;
            state.selectedAuthmode = authmode;
            ssidInput.value = ssid;
            updateSubmitState();
            updatePasswordState(authmode);
            updateSelectionCard(ssid, authmode);

            document.querySelectorAll('.network-item').forEach((item) => {
                item.classList.toggle('selected', item.dataset.ssid === ssid);
            });

            if (settings.scrollToForm && formPane) {
                formPane.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }

            if (settings.scrollToForm && authmode !== 0) {
                window.setTimeout(() => {
                    passwordInput.focus({ preventScroll: true });
                }, 260);
            }

            if (settings.scrollToForm && authmode === 0) {
                window.setTimeout(() => {
                    submitButton.focus({ preventScroll: true });
                }, 260);
            }
        }

        function clearSelection() {
            state.selectedSsid = '';
            state.selectedAuthmode = 0;
            ssidInput.value = '';
            passwordInput.value = '';
            updateSubmitState();
            updatePasswordState(0);
            updateSelectionCard('', 0);
        }

        function renderNetworks(aps) {
            networkList.innerHTML = '';

            if (!aps.length) {
                clearSelection();
                networkList.innerHTML = '<div class="empty-state">No Wi-Fi found yet. Move closer to the router and refresh.</div>';
                setStatus('No networks found');
                return;
            }

            aps
                .sort((a, b) => b.rssi - a.rssi)
                .forEach((ap) => {
                    const button = document.createElement('button');
                    button.type = 'button';
                    button.className = 'network-item';
                    button.dataset.ssid = ap.ssid;
                    button.innerHTML = `
                        <div class="network-row">
                            <div class="network-name">${escapeHtml(ap.ssid)}</div>
                            <div class="signal">${signalLabel(ap.rssi)}</div>
                        </div>
                        <div class="network-meta">
                            <span>${authLabel(ap.authmode)}</span>
                            <span>${ap.rssi} dBm</span>
                        </div>
                    `;
                    button.addEventListener('click', () => selectNetwork(ap.ssid, ap.authmode, { scrollToForm: true }));
                    networkList.appendChild(button);
                });

            setStatus(aps.length + ' network' + (aps.length === 1 ? '' : 's'));

            if (state.selectedSsid) {
                const selectedAp = aps.find((ap) => ap.ssid === state.selectedSsid);
                if (selectedAp) {
                    selectNetwork(selectedAp.ssid, selectedAp.authmode, { scrollToForm: false });
                } else {
                    clearSelection();
                }
            }
        }

        async function loadNetworks() {
            if (state.isRefreshing) {
                return;
            }

            state.isRefreshing = true;
            refreshButton.disabled = true;
            setStatus('Scanning...');

            try {
                const response = await fetch('/scan', { cache: 'no-store' });
                const data = await response.json();
                renderNetworks(data.aps || []);
            } catch (err) {
                networkList.innerHTML = '<div class="empty-state">Unable to load Wi-Fi right now. Refresh and try again.</div>';
                setStatus('Scan failed');
            } finally {
                state.isRefreshing = false;
                refreshButton.disabled = false;
            }
        }

        function scheduleRefresh() {
            if (state.refreshTimer) {
                clearTimeout(state.refreshTimer);
            }
            state.refreshTimer = setTimeout(async () => {
                await loadNetworks();
                scheduleRefresh();
            }, 6000);
        }

        async function submitNetwork(event) {
            event.preventDefault();
            errorLabel.textContent = '';

            if (!state.selectedSsid) {
                errorLabel.textContent = 'Please choose a Wi-Fi network first.';
                return;
            }

            submitButton.disabled = true;
            submitButton.textContent = 'Saving...';
            setLoadingState(
                'Checking Wi-Fi...',
                'The device is testing this network and saving the password. Keep this page open for a few seconds.'
            );
            loadingOverlay.classList.add('show');

            try {
                const response = await fetch('/submit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        ssid: state.selectedSsid,
                        password: passwordInput.value,
                    }),
                });

                const data = await response.json();
                if (!data.success) {
                    throw new Error(data.error || 'Unable to join this network.');
                }

                setLoadingState('Wi-Fi saved.', 'Preparing the restart page...');
                window.location.replace('/done.html');
            } catch (err) {
                loadingOverlay.classList.remove('show');
                errorLabel.textContent = err.message;
                submitButton.textContent = 'Save Wi-Fi';
                setLoadingState(
                    'Checking Wi-Fi...',
                    'The device is testing this network and saving the password. Keep this page open for a few seconds.'
                );
                updateSubmitState();
            }
        }

        refreshButton.addEventListener('click', loadNetworks);
        wifiForm.addEventListener('submit', submitNetwork);

        togglePasswordButton.addEventListener('click', () => {
            if (togglePasswordButton.disabled) {
                return;
            }

            const showPassword = passwordInput.type === 'password';
            passwordInput.type = showPassword ? 'text' : 'password';
            togglePasswordButton.textContent = showPassword ? 'Hide' : 'Show';
        });

        document.addEventListener('DOMContentLoaded', async () => {
            hideBrowserChrome();
            clearSelection();
            await loadSavedNetworks();
            await loadNetworks();
            scheduleRefresh();
        });

        window.addEventListener('load', hideBrowserChrome);
        window.addEventListener('orientationchange', hideBrowserChrome);
        window.addEventListener('resize', hideBrowserChrome);

        ['pointerdown', 'touchstart', 'click'].forEach((eventName) => {
            document.addEventListener(eventName, enterImmersiveMode, { passive: true, once: true });
        });
    </script>
</body>
</html>
